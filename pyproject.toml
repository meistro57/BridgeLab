[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgelab"
version = "0.1.0"
description = "Experimental validation engine: tests discoveries from KAE, Meta-Bridge, Vectoreologist, MisfitCrew, and Keystone against withheld evidence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Mark Hubrich" }]
dependencies = []

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.9"]
dev = ["pytest>=8"]

[project.scripts]
bridgelab = "bridgelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
